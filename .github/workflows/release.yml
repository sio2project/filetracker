name: publish
run-name: Publish to PyPi
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $project_version in pyproject.toml"
            exit 1
          fi
      - name: Install build
        run: |
          python3 -m pip install build
          python3 -m pip install setuptools --upgrade
      - name: Build
        run: |
          python3 -m build --sdist --wheel --outdir dist/ .
      - name: Publish
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}